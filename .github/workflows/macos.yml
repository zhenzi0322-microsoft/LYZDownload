name: build-macos

# 触发方式：
#  1) 推送以 mac 开头的 tag（例如 mac0.1.0）——自动用该 tag 建/更新 GitHub Release。
#  2) 在 Actions 页面手动触发（workflow_dispatch）——可在输入框填一个 Release tag；
#     留空则只构建、不发 Release（产物会作为构建 artifact 保留）。
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要创建 / 更新的 Release tag（手动触发时填写；tag 推送触发可留空）'
        required: false
        default: ''
  push:
    tags:
      - 'mac*'

permissions:
  contents: write   # 创建 / 更新 GitHub Release 需要写权限

jobs:
  build-macos:
    name: 构建 macOS 包（arm64 + x86_64 + universal）
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 未配置签名：不填 APPLE_CERTIFICATE / TAURI_SIGNING_* 即产出未签名包，
      # 也不会产出 .sig（产物列表里看不到它是正常的）。如需签名 / 公证，见文件末尾注释。
    steps:
      # 源码在 Codeup 私有库，本 GitHub 仓库只有 README/workflow，
      # 所以后面所有构建步骤都必须显式指向 demo 目录。
      - name: Clone Codeup private repo into demo
        env:
          CODEUP_TOKEN: ${{ secrets.CODEUP_TOKEN }}
        # 用 pwsh 的 ${env:...} 取变量，而不是 ${{ }} 直接拼进命令行，
        # 避免 token 出现在进程命令行里。
        run: |
          git clone "https://oauth2:${env:CODEUP_TOKEN}@codeup.aliyun.com/zheniz0322/LYZDownload.git" demo
        shell: pwsh

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal 包需要同时能编到 arm64 与 x86_64 两个目标
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 缓存 Rust 依赖（加速重复构建）
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './demo/src-tauri -> target'

      - name: 安装前端依赖
        # npm ci / npm install 都会触发 package.json 的 postinstall：node scripts/copy-vditor.mjs
        # 把 Vditor 运行时资源同步到 public/vendor，供打包后离线加载。
        # 仓库里提交了 package-lock.json 时才用 npm ci（可复现安装）；
        # 没提交时 npm ci 会直接 EUSAGE 报错，回退到 npm install。
        working-directory: demo
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "::notice::found lockfile, running npm ci"
            npm ci
          else
            echo "::warning::no lockfile committed in repo, falling back to npm install (versions not pinned)"
            npm install
          fi

      - name: 修正 tauri.conf.json（frontendDist + bundle）
        # 1) vite outDir "../dist" 相对于 demo/ 实际输出在 workspace 根 dist/，
        #    但 Tauri frontendDist "../dist" 相对于 src-tauri/ 解析为 demo/dist，不一致。
        # 2) 仓库可能未配置 macOS bundle targets，强制开启并设为 all。
        working-directory: demo
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(p, "utf8"));

            // 修正 frontendDist
            if (conf.build && conf.build.frontendDist === "../dist") {
              conf.build.frontendDist = "../../dist";
              console.log("patched frontendDist -> ../../dist");
            }

            // 确保 bundle 开启且 targets 包含 macOS
            conf.bundle = conf.bundle || {};
            conf.bundle.active = true;
            conf.bundle.targets = "all";
            console.log("ensured bundle.active=true, bundle.targets=all");

            fs.writeFileSync(p, JSON.stringify(conf, null, 2) + "\n");
          '

      # 三种架构串行构建，不用 tauri-action（它会用 productName 拼产物路径，
      # 和 Cargo 包名生成的实际文件名可能不一致）。直接用 tauri CLI + glob 查找产物。
      - name: 构建 Apple Silicon（aarch64）
        working-directory: demo
        shell: bash
        run: npx tauri build --target aarch64-apple-darwin

      - name: 构建 Intel（x86_64）
        working-directory: demo
        shell: bash
        run: npx tauri build --target x86_64-apple-darwin

      - name: 构建 Universal
        working-directory: demo
        shell: bash
        run: npx tauri build --target universal-apple-darwin

      # 打印实际产物目录（方便调试）
      - name: 列出构建产物
        shell: bash
        run: |
          for triple in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
            echo "=== $triple ==="
            find "demo/src-tauri/target/$triple/release/bundle" -maxdepth 2 2>/dev/null || echo "  (no bundle dir)"
          done

      # 把产物收集到 release-files/ 目录：优先用 DMG，没有则把 .app 压成 zip
      - name: 收集产物到 release-files
        shell: bash
        run: |
          mkdir -p release-files
          for triple in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
            dmg_dir="demo/src-tauri/target/$triple/release/bundle/dmg"
            macos_dir="demo/src-tauri/target/$triple/release/bundle/macos"
            # 有 DMG 直接拷贝
            if ls "$dmg_dir"/*.dmg 1>/dev/null 2>&1; then
              cp "$dmg_dir"/*.dmg release-files/
            elif ls "$macos_dir"/*.app 1>/dev/null 2>&1 || ls -d "$macos_dir"/*.app 1>/dev/null 2>&1; then
              # 无 DMG，把 .app 目录打包成 zip
              for app in "$macos_dir"/*.app; do
                [ -e "$app" ] || continue
                name=$(basename "$app" .app)
                echo "Zipping $app -> release-files/${name}_${triple}.zip"
                (cd "$macos_dir" && zip -r -q "$GITHUB_WORKSPACE/release-files/${name}_${triple}.zip" "$name.app")
              done
            else
              echo "::warning::No bundle found for $triple"
            fi
          done
          echo "=== release-files ==="
          ls -lh release-files/

      - name: 上传构建 artifact
        uses: actions/upload-artifact@v4
        with:
          name: LYZDownload-macos-bundles
          path: release-files/*
          retention-days: 7
          if-no-files-found: warn

      # 有 tag 时发布到 GitHub Release
      - name: 发布到 GitHub Release
        if: ${{ github.event_name == 'push' || inputs.tag_name != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: 'LYZDownload v${{ inputs.tag_name || github.ref_name }}'
          body: 'macOS 安装包：_aarch64（Apple Silicon）/ _x64（Intel）/ _universal（两种都能跑）。未签名，首次打开需右键 → 打开。'
          draft: true
          prerelease: false
          files: release-files/*

# ─────────────────────────────────────────────────────────────────────────
# 补充说明
#
# 【只打某一种 / 部分架构】下面三个「构建 …」步骤，不需要哪个就删哪个（产物体积更小、构建更快）：
#     npx tauri build --target aarch64-apple-darwin     # 仅 Apple Silicon
#     npx tauri build --target x86_64-apple-darwin      # 仅 Intel
#     npx tauri build --target universal-apple-darwin   # 双架构合一
#   上面 rust-toolchain 的 targets 已经是 {aarch64, x86_64} 全集，universal 由两者合成，
#   所以只删步骤 + 对应的上传路径就行，不必改 targets。
#
# 【为什么不用 tauri-action】tauri-action 会用 productName 拼接预期产物文件名，
#   和实际 Cargo 包名生成的文件名可能不一致（如 productName=“LYZDownload” 但
#   Cargo 包名为 “tauri-downloader”），导致 “No artifacts were found” 错误。
#   直接用 tauri CLI + glob 上传更可靠。
#
# 【开启签名 / 公证（可选，日后要做时）】在仓库 Settings → Secrets 里加：
#     APPLE_CERTIFICATE            # .p12 开发者证书（base64）
#     APPLE_CERTIFICATE_PASSWORD   # 证书密码
#     APPLE_SIGNING_IDENTITY       # 例如 "Developer ID Application: 你的名字 (TEAMID)"
#     APPLE_ID                     # 开发者 Apple ID（公证用）
#     APPLE_PASSWORD               # App 专用密码
#     APPLE_TEAM_ID                # 团队 ID
#   配好这些 secret 后，tauri-action 会自动识别并完成签名 + 公证，无需改本文件。
#
# 【注意】macOS runner 需在 GitHub 上运行；私有仓库的 macOS 分钟按 10x 计费。
#   本仓库不含 Tauri 源码，构建代码始终来自上面 clone 的 Codeup 私有库默认分支；
#   GitHub 侧的 mac* tag 只用来给 Release 命名 / 定位，并不会切到对应代码版本。
#   若要严格对应版本，clone 时加 --branch <tag 或 commit>。
#
# 【Release 可见性】draft: true 表示 Release 建出来是草稿，
#   需要在 Releases 页面手动点 publish 才对外可见；想 tag 推送即发布，改成 false。
# ─────────────────────────────────────────────────────────────────────────
